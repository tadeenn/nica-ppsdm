<!-- Subtle top accent line -->
<div class="absolute top-0 left-0 w-full h-1 bg-primary"></div>
<!-- Branding / Logo Section -->
<div class="text-center mb-xl">
<!-- Using exact placeholder provided without data-alt as per rules -->
<img alt="NICA Logo" class="h-20 w-auto mx-auto object-contain mb-lg" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC2A9i7LVMhkqsEcrQNpdqXOwVUFgczbFqCpoNf4c-K9mGOj_t81jYYzmkLqQde_moDhf-z54pwOqLGakzmQvMb6m391xax4SIzYe6SceDdYoP3qVtonQWlNs3VCg4ktHI5oChzfiirp9GRqUd1aytbemI9RSCAgaXJFJk3lTuOqyHE3O5GyUUVoeHUknX3JHdjKeQtubZX4iVqwJhDAOcTLF3H8_7QAuAeAxZQl4gprGMn16MUuzts31TVGtN56WpIPbc">
<h1 class="font-headline-md text-headline-md text-on-surface mb-xs">Login ke Portal</h1>

<!-- Login Form -->
<form action="#" class="space-y-lg" method="POST">
<!-- Username Input -->
<div class="space-y-xs">
<label class="block font-body-sm text-body-sm font-semibold text-on-surface" for="username">Username</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline pointer-events-none transition-colors group-focus-within:text-primary">person</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface border border-outline-variant rounded-lg font-body-sm text-body-sm text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all shadow-sm" id="username" name="username" placeholder="Masukkan username" required="" type="text">
</div>
</div>
<!-- Password Input -->
<div class="space-y-xs">
<div class="flex justify-between items-center">
<label class="block font-body-sm text-body-sm font-semibold text-on-surface" for="password">Password</label>
<a class="font-body-sm text-body-sm text-primary hover:text-tertiary-container transition-colors" href="#">Lupa Password?</a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline pointer-events-none transition-colors group-focus-within:text-primary">lock</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface border border-outline-variant rounded-lg font-body-sm text-body-sm text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all shadow-sm" id="password" name="password" placeholder="Masukkan password" required="" type="password">
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary font-body-lg text-body-lg py-3 rounded-lg hover:bg-tertiary-container active:scale-[0.98] transition-all flex items-center justify-center gap-2 shadow-sm mt-md" type="submit">
                Masuk
                <span class="material-symbols-outlined text-sm">login</span>
</button>
</form>

<div class="mt-xl text-center">
<p class="font-label-caps text-label-caps text-outline-variant uppercase">Secure Connection</p>
</div>
</main>
<script>
        // Simple script to handle input focus styling on icons if needed
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.previousElementSibling.classList.add('text-primary');
                input.previousElementSibling.classList.remove('text-outline');
            });
            input.addEventListener('blur', () => {
                input.previousElementSibling.classList.remove('text-primary');
                input.previousElementSibling.classList.add('text-outline');
            });
        });
    </script>
