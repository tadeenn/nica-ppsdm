<!-- Chart Configuration Script -->
<script>
        document.addEventListener('DOMContentLoaded', function() {
            const ctx = document.getElementById('historyChart').getContext('2d');
            
            // Dummy Data generation for visual representation
            const labels = Array.from({length: 24}, (_, i) => `${i}:00`);
            const moistureData = Array.from({length: 24}, () => Math.floor(Math.random() * (85 - 55 + 1) + 55));
            const tempData = Array.from({length: 24}, () => Math.floor(Math.random() * (30 - 20 + 1) + 20));

            // Create gradient for moisture area
            const moistureGradient = ctx.createLinearGradient(0, 0, 0, 400);
            moistureGradient.addColorStop(0, 'rgba(0, 105, 72, 0.15)'); // primary emerald 15%
            moistureGradient.addColorStop(1, 'rgba(0, 105, 72, 0)');

            // Create gradient for temp area
            const tempGradient = ctx.createLinearGradient(0, 0, 0, 400);
            tempGradient.addColorStop(0, 'rgba(59, 130, 246, 0.15)'); // blue 15%
            tempGradient.addColorStop(1, 'rgba(59, 130, 246, 0)');

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Kelembapan Tanah (%)',
                            data: moistureData,
                            borderColor: '#006948', // primary emerald
                            backgroundColor: moistureGradient,
                            borderWidth: 2,
                            pointRadius: 0,
                            pointHoverRadius: 6,
                            pointBackgroundColor: '#ffffff',
                            pointBorderColor: '#006948',
                            pointBorderWidth: 2,
                            fill: true,
                            tension: 0.4
                        },
                        {
                            label: 'Suhu (°C)',
                            data: tempData,
                            borderColor: '#3b82f6', // distinct blue for temp
                            backgroundColor: tempGradient,
                            borderWidth: 2,
                            pointRadius: 0,
                            pointHoverRadius: 6,
                            pointBackgroundColor: '#ffffff',
                            pointBorderColor: '#3b82f6',
                            pointBorderWidth: 2,
                            fill: true,
                            tension: 0.4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    },
                    plugins: {
                        legend: {
                            display: false // Using custom HTML legend above
                        },
                        tooltip: {
                            backgroundColor: '#002114', // very dark green (on-primary-fixed)
                            titleColor: '#ffffff',
                            bodyColor: '#ffffff',
                            cornerRadius: 8,
                            padding: 12,
                            displayColors: true,
                            boxPadding: 6
                        }
                    },
                    scales: {
                        x: {
                            grid: {
                                display: false,
                                drawBorder: false
                            },
                            ticks: {
                                color: '#6d7a72', // outline
                                maxTicksLimit: 8,
                                font: {
                                    family: 'Inter',
                                    size: 12
                                }
                            }
                        },
                        y: {
                            grid: {
                                color: '#F3F4F6', // light grid lines
                                drawBorder: false,
                            },
                            ticks: {
                                color: '#6d7a72', // outline
                                font: {
                                    family: 'Inter',
                                    size: 12
                                }
                            },
                            beginAtZero: false,
                            min: 10,
                            max: 100
                        }
                    }
                }
            });
        });
    </script>
